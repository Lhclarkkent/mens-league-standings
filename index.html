<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cornerstone Men's League — Combined Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #16213E;
    --navy-2: #1F2C4E;
    --navy-3: #1A2542;
    --border: #3A4A73;
    --gold: #C9A227;
    --cream: #F7F4EF;
    --muted: #7C8AB0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--navy);
    color: var(--cream);
    font-family: 'Work Sans', 'Helvetica Neue', sans-serif;
  }
  .field-lines {
    background-image: repeating-linear-gradient(90deg, transparent, transparent 78px, rgba(247,244,239,0.05) 78px, rgba(247,244,239,0.05) 80px);
    border-bottom: 3px solid var(--gold);
    padding: 2.5rem 1.5rem 2rem;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 1.5rem; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: 'Anton', sans-serif;
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    margin: 0;
    line-height: 1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.75rem;
  }
  .sort-row { display: flex; gap: 1.5rem; align-items: center; margin: 2rem 0 0.75rem; flex-wrap: wrap; }
  .sort-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .sort-btn {
    background: none; border: none; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem;
    letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; padding: 0.25rem 0;
  }
  .sort-btn.active { color: var(--gold); }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--navy-2); }
  th {
    text-align: center; padding: 0.75rem 1rem;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    border-bottom: 2px solid var(--gold);
  }
  th.left { text-align: left; }
  td { padding: 0.75rem 1rem; text-align: center; }
  td.left { text-align: left; font-weight: 600; }
  .board { border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .rank, .pa { color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .stat { font-family: 'IBM Plex Mono', monospace; }
  .pill { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; font-weight: 600; padding: 0.15rem 0.45rem; border-radius: 4px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { filter: brightness(1.08); }
  .roster-row td { padding: 0; }
  .roster-panel { padding: 1rem 1.5rem 1.25rem; background: var(--navy-3); border-top: 1px dashed var(--border); }
  .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.5rem 1.5rem; }
  .roster-item { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.2rem 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .roster-item .pos { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; }
  .empty, .error {
    margin-top: 2rem; text-align: center; padding: 2.5rem 1rem; color: var(--muted);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem;
  }
  .error { color: #E0A17E; }
  .footer-note { margin: 2rem 0 3rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <div class="field-lines">
    <div class="wrap">
      <div class="eyebrow">Cornerstone Men's League · Combined Board</div>
      <h1>Three Divisions.<br />One Standings Board.</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
  </div>

  <div class="wrap">
    <div class="sort-row">
      <span class="sort-label">Sort by</span>
      <button class="sort-btn active" data-sort="winPct">Record</button>
      <button class="sort-btn" data-sort="pointsFor">Points For</button>
      <button class="sort-btn" data-sort="division">Division</button>
    </div>
    <div id="content"></div>
    <div class="footer-note">Tap a team to see its roster. Standings refresh automatically every few hours.</div>
  </div>

<script>
let allTeams = [];
let sortKey = "winPct";

function fmtPct(p) { return Math.round(p * 100) + "%"; }
function fmtPts(p) { return Number(p).toFixed(1); }

function sortTeams(teams) {
  const copy = [...teams];
  if (sortKey === "winPct") copy.sort((a, b) => b.winPct - a.winPct || b.pointsFor - a.pointsFor);
  if (sortKey === "pointsFor") copy.sort((a, b) => b.pointsFor - a.pointsFor);
  if (sortKey === "division") copy.sort((a, b) => a.divisionLabel.localeCompare(b.divisionLabel) || b.winPct - a.winPct);
  return copy;
}

function render() {
  const content = document.getElementById("content");
  if (allTeams.length === 0) {
    content.innerHTML = '<div class="empty">No standings yet. Once league IDs are configured and the first scrape runs, teams will show up here.</div>';
    return;
  }
  const sorted = sortTeams(allTeams);
  let rows = "";
  sorted.forEach((t, i) => {
    const rosterId = "roster-" + t.key;
    rows += `
      <tr data-target="${rosterId}">
        <td class="rank">${i + 1}</td>
        <td class="left">${t.name}</td>
        <td><span class="pill" style="background:${t.divisionColor};color:#16213E">${t.divisionLabel}</span></td>
        <td class="stat">${t.wins}-${t.losses}-${t.ties}</td>
        <td class="stat">${fmtPct(t.winPct)}</td>
        <td class="stat">${fmtPts(t.pointsFor)}</td>
        <td class="pa stat">${fmtPts(t.pointsAgainst)}</td>
      </tr>
      <tr class="roster-row" id="${rosterId}" style="display:none;">
        <td colspan="7">
          <div class="roster-panel">
            <div class="roster-grid">
              ${
                t.roster.length
                  ? t.roster.map(p => `<div class="roster-item"><span>${p.name}</span><span class="pos">${p.slot} · ${p.proTeam}</span></div>`).join("")
                  : '<span class="pos">No roster data</span>'
              }
            </div>
          </div>
        </td>
      </tr>`;
  });

  content.innerHTML = `
    <div class="board">
      <table>
        <thead>
          <tr>
            <th>Rank</th><th class="left">Team</th><th>Div</th><th>W-L-T</th><th>Win %</th><th>PF</th><th>PA</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  content.querySelectorAll("tbody tr[data-target]").forEach(row => {
    row.addEventListener("click", () => {
      const panel = document.getElementById(row.dataset.target);
      panel.style.display = panel.style.display === "none" ? "table-row" : "none";
    });
  });
}

document.querySelectorAll(".sort-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    sortKey = btn.dataset.sort;
    document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
});

fetch("data.json?" + Date.now())
  .then(r => r.json())
  .then(data => {
    const meta = document.getElementById("meta");
    const generated = new Date(data.generatedAt);
    meta.textContent = `Season ${data.season} · Updated ${generated.toLocaleString()}`;

    allTeams = [];
    (data.divisions || []).forEach(div => {
      (div.teams || []).forEach(t => {
        allTeams.push({
          key: div.key + "-" + t.id,
          name: t.name,
          divisionLabel: div.label,
          divisionColor: div.color,
          wins: t.wins, losses: t.losses, ties: t.ties,
          winPct: t.winPct, pointsFor: t.pointsFor, pointsAgainst: t.pointsAgainst,
          roster: t.roster || [],
        });
      });
    });

    if (data.errors && data.errors.length) {
      const content = document.getElementById("content");
      const errDiv = document.createElement("div");
      errDiv.className = "error";
      errDiv.textContent = "Some divisions failed to load: " + data.errors.map(e => e.division).join(", ");
      content.parentNode.insertBefore(errDiv, content);
    }

    render();
  })
  .catch(() => {
    document.getElementById("content").innerHTML = '<div class="error">Couldn\'t load data.json yet. Once the GitHub Action runs for the first time, this page will populate automatically.</div>';
  });
</script>
</body>
</html>
