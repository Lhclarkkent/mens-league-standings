name: Update Fantasy Standings

on:
  schedule:
    # Runs every Tuesday at 11:00 AM UTC (6:00 AM Central Time)
    - cron: '0 11 * * 2'
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install espn-api

      - name: Run Python script
        env:
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python update_standings.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add standings.csv
          git commit -m "Automated standings update" || exit 0
          git push
