name: Update fantasy standings

on:
  schedule:
    # Every 6 hours. Adjust as you like (cron is UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scrape ESPN leagues
        env:
          SEASON: ${{ vars.SEASON }}
          LEAGUE_A_ID: ${{ vars.LEAGUE_A_ID }}
          LEAGUE_B_ID: ${{ vars.LEAGUE_B_ID }}
          LEAGUE_C_ID: ${{ vars.LEAGUE_C_ID }}
          LEAGUE_A_LABEL: ${{ vars.LEAGUE_A_LABEL }}
          LEAGUE_B_LABEL: ${{ vars.LEAGUE_B_LABEL }}
          LEAGUE_C_LABEL: ${{ vars.LEAGUE_C_LABEL }}
        run: node scrape.js

      - name: Commit updated data
        run: |
          git config user.name "league-standings-bot"
          git config user.email "actions@github.com"
          git add docs/data.json
          git diff --quiet --cached || git commit -m "Update standings"
          git push
