name: Update Fantasy Standings

on:
  workflow_dispatch: # Enables manual trigger button

jobs:
  update-standings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install ESPN API package
        run: pip install espn-api

      - name: Run Python script
        env:
          SWID: ${{ secrets.SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
        run: python update_standings.py

      - name: Commit and Push the new CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add standings.csv
          git commit -m "Manual ESPN standings update" || exit 0
          git push
